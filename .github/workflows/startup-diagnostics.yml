name: Startup Diagnostic APK Matrix

"on":
  push:
    branches:
      - "arena/712d51fd-dnsgaurd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Prepare Android SDK and local.properties
        shell: bash
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          FLUTTER_BIN=$(which flutter)
          echo "flutter.sdk=$(dirname "$(dirname "$FLUTTER_BIN")")" >> android/local.properties
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          sudo apt-get update -y
          sudo apt-get install -y libsqlite3-dev zip unzip

      - name: Resolve, analyze, and test
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test --reporter expanded

      - name: Build A - ARM64 debug
        shell: bash
        run: |
          set +e
          flutter build apk --debug --target-platform android-arm64 --split-per-abi \
            2>&1 | tee build-A-debug.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            SUMMARY=$(tail -n 100 build-A-debug.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Variant A build failed::$SUMMARY"
            exit "$STATUS"
          fi
          mkdir -p startup-diagnostic-apks
          APK=$(find build/app/outputs/flutter-apk -name "*arm64*v8a*debug*.apk" -type f | head -n1)
          test -n "$APK" && test -f "$APK"
          cp "$APK" startup-diagnostic-apks/dns-guardian-A-arm64-debug.apk

      - name: Build B - ARM64 AOT without minification
        shell: bash
        run: |
          rm -rf build
          set +e
          CI_TEST_APK=true CI_DISABLE_MINIFY=true flutter build apk --release \
            --target-platform android-arm64 --split-per-abi \
            2>&1 | tee build-B-aot-no-minify.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            SUMMARY=$(tail -n 100 build-B-aot-no-minify.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Variant B build failed::$SUMMARY"
            exit "$STATUS"
          fi
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" -type f | head -n1)
          test -n "$APK" && test -f "$APK"
          cp "$APK" startup-diagnostic-apks/dns-guardian-B-arm64-aot-no-minify.apk

      - name: Build C - ARM64 AOT with minification
        shell: bash
        run: |
          rm -rf build
          set +e
          CI_TEST_APK=true CI_DISABLE_MINIFY=false flutter build apk --release \
            --target-platform android-arm64 --split-per-abi \
            2>&1 | tee build-C-aot-minified.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            SUMMARY=$(tail -n 100 build-C-aot-minified.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Variant C build failed::$SUMMARY"
            exit "$STATUS"
          fi
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" -type f | head -n1)
          test -n "$APK" && test -f "$APK"
          cp "$APK" startup-diagnostic-apks/dns-guardian-C-arm64-aot-minified.apk

      - name: Analyze and verify all APK variants
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME" -name aapt -type f | sort -V | tail -n1)
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | sort -V | tail -n1)

          for APK in startup-diagnostic-apks/*.apk; do
            NAME=$(basename "$APK")
            SIZE=$(stat -c %s "$APK")
            SHA=$(sha256sum "$APK" | cut -d' ' -f1)
            BADGING=$("$AAPT" dump badging "$APK" | grep -E "package:|launchable-activity:|native-code:" | head -n4 | tr '\n' ' ')
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            echo "::notice title=$NAME::$SIZE bytes | sha256=$SHA | $BADGING"
          done

          FINAL_SIZE=$(stat -c %s startup-diagnostic-apks/dns-guardian-C-arm64-aot-minified.apk)
          if [ "$FINAL_SIZE" -gt 52428800 ]; then
            echo "Final minified test APK exceeds 50 MiB: $FINAL_SIZE bytes" >&2
            exit 1
          fi

          python3 - startup-diagnostic-apks/*.apk <<'PY'
          import collections
          import pathlib
          import sys
          import zipfile

          def mib(value):
              return value / (1024 * 1024)

          reports = []
          for value in sys.argv[1:]:
              apk = pathlib.Path(value)
              with zipfile.ZipFile(apk) as archive:
                  entries = [e for e in archive.infolist() if not e.is_dir()]
              top = collections.defaultdict(int)
              abi = collections.defaultdict(int)
              for entry in entries:
                  parts = entry.filename.split('/')
                  top[parts[0]] += entry.file_size
                  if len(parts) >= 3 and parts[0] == 'lib':
                      abi[parts[1]] += entry.file_size
              largest = sorted(entries, key=lambda e: e.file_size, reverse=True)[:8]
              lines = [
                  f'{apk.name}: file={mib(apk.stat().st_size):.2f}MiB '
                  f'entries_raw={mib(sum(e.file_size for e in entries)):.2f}MiB',
                  'dirs=' + ', '.join(f'{k}:{mib(v):.2f}MiB' for k, v in sorted(top.items(), key=lambda i: i[1], reverse=True)),
                  'abis=' + ', '.join(f'{k}:{mib(v):.2f}MiB' for k, v in sorted(abi.items())),
                  'largest=' + '; '.join(f'{e.filename}:{mib(e.file_size):.2f}MiB' for e in largest),
              ]
              report = '\n'.join(lines)
              reports.append(report)
              notice = report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Size breakdown {apk.name}::{notice}')
          pathlib.Path('startup-diagnostic-size-report.txt').write_text('\n\n'.join(reports) + '\n')
          PY

          (cd startup-diagnostic-apks && sha256sum *.apk > SHA256SUMS.txt)

      - name: Test ZIP list, integrity, extraction, and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf startup-zip-extracted startup-diagnostic-apks.zip
          zip -j -q startup-diagnostic-apks.zip startup-diagnostic-apks/*
          unzip -l startup-diagnostic-apks.zip
          unzip -t startup-diagnostic-apks.zip
          mkdir startup-zip-extracted
          unzip -q startup-diagnostic-apks.zip -d startup-zip-extracted
          (cd startup-zip-extracted && sha256sum -c SHA256SUMS.txt)
          rm -rf startup-zip-extracted startup-diagnostic-apks.zip

      - name: Upload exact diagnostic APKs
        uses: actions/upload-artifact@v4
        with:
          name: dns-guardian-startup-diagnostic-apks
          path: startup-diagnostic-apks/
          if-no-files-found: error
          retention-days: 30

      - name: Download and extract uploaded artifact
        uses: actions/download-artifact@v4
        with:
          name: dns-guardian-startup-diagnostic-apks
          path: startup-artifact-roundtrip

      - name: Verify uploaded artifact round trip
        shell: bash
        run: |
          set -euo pipefail
          test "$(find startup-artifact-roundtrip -name '*.apk' -type f | wc -l)" -eq 3
          (cd startup-artifact-roundtrip && sha256sum -c SHA256SUMS.txt)
          echo "::notice title=Startup diagnostic artifact verified::download and extraction succeeded; all three APK checksums match"
