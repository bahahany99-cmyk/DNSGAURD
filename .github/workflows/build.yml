name: Build DNS Guardian APK

# NOTE: "on" is quoted because some YAML/GitHub parsers treat the bare key `on`
# as a boolean, which would prevent the workflow triggers from registering.
"on":
  push:
    branches:
      - "arena/f09b47b4-dnsgaurd"
      - "arena/712d51fd-dnsgaurd"
      - "arena/**"
  pull_request:
    branches:
      - "arena/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK variant to build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

# Network access (to download Flutter/Android SDK) is available on GitHub-hosted
# runners. This CI produces a reproducible APK and runs automated tests.
# CI verification does NOT equal physical-device verification on the Realme RMX3636
# (those tests are documented in SECURITY_TEST_REPORT.md).

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Prepare Android local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          # flutter-action sets FLUTTER_ROOT; fall back to PATH lookup
          FLUTTER_BIN=$(which flutter || echo "")
          if [ -n "$FLUTTER_BIN" ]; then
            FLUTTER_ROOT_DIR=$(dirname $(dirname "$FLUTTER_BIN"))
            echo "flutter.sdk=$FLUTTER_ROOT_DIR" >> android/local.properties
          elif [ -n "$FLUTTER_ROOT" ]; then
            echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          fi
          cat android/local.properties

      - name: Install system deps + accept Android licenses
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsqlite3-dev
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then
            SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -f "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses || true
          else
            echo "sdkmanager not found at $SDKMGR, trying PATH sdkmanager"
            yes | sdkmanager --licenses || true
          fi

      - name: Ensure Android SDK platform/build-tools
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMGR" ]; then
            SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -f "$SDKMGR" ]; then
            "$SDKMGR" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          else
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          fi

      - name: Flutter doctor (info only)
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        # Analyzer errors remain fatal. Warnings and info-level deprecations are
        # reported but do not block this Phase 2 compilation-validation build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter unit tests (no device required)
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
          TEST_EXIT=${PIPESTATUS[0]}
          if [ "$TEST_EXIT" -ne 0 ]; then
            SUMMARY=$(tail -n 80 flutter-test.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Flutter unit tests failed::$SUMMARY"
          fi
          exit "$TEST_EXIT"

      # GitHub does not allow the `secrets` context directly in a step `if`.
      # Keep the condition in the shell so the workflow passes validation.
      - name: Decode release keystore (if provided)
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/android/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No owner release keystore requested/provided; debug build will be used."
          fi

      - name: Build APK (release if keystore present, else debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          BT="${{ github.event.inputs.build_type }}"
          set +e
          if [ "$BT" = "release" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "Building RELEASE (owner-key signed) APK"
            flutter build apk --release 2>&1 | tee flutter-build.log
          else
            echo "Building DEBUG APK (debug-key signed)"
            flutter build apk --debug 2>&1 | tee flutter-build.log
          fi
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            SUMMARY=$(tail -n 100 flutter-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Flutter APK build failed::$SUMMARY"
          fi
          exit "$BUILD_EXIT"

      - name: Analyze APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          python3 - "$APK" <<'PY'
          import collections
          import pathlib
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(apk) as archive:
              entries = [entry for entry in archive.infolist() if not entry.is_dir()]

          def mib(value):
              return value / (1024 * 1024)

          largest = sorted(entries, key=lambda entry: entry.file_size, reverse=True)[:25]
          abi_totals = collections.defaultdict(lambda: [0, 0, 0])
          top_totals = collections.defaultdict(lambda: [0, 0, 0])
          for entry in entries:
              parts = entry.filename.split('/')
              top = parts[0]
              top_totals[top][0] += entry.file_size
              top_totals[top][1] += entry.compress_size
              top_totals[top][2] += 1
              if len(parts) >= 3 and parts[0] == 'lib':
                  abi = parts[1]
                  abi_totals[abi][0] += entry.file_size
                  abi_totals[abi][1] += entry.compress_size
                  abi_totals[abi][2] += 1

          lines = [
              f'APK={apk.name} entries={len(entries)} '
              f'uncompressed={mib(sum(e.file_size for e in entries)):.2f}MiB '
              f'compressed={mib(sum(e.compress_size for e in entries)):.2f}MiB',
              'TOP-LEVEL (uncompressed/compressed/count):',
          ]
          for name, (raw, compressed, count) in sorted(
              top_totals.items(), key=lambda item: item[1][0], reverse=True
          ):
              lines.append(f'  {name}: {mib(raw):.2f}/{mib(compressed):.2f}MiB ({count})')
          lines.append('ABIS (uncompressed/compressed/count):')
          for name, (raw, compressed, count) in sorted(
              abi_totals.items(), key=lambda item: item[1][0], reverse=True
          ):
              lines.append(f'  {name}: {mib(raw):.2f}/{mib(compressed):.2f}MiB ({count})')
          lines.append('LARGEST FILES (uncompressed/compressed):')
          for entry in largest:
              lines.append(
                  f'  {mib(entry.file_size):.2f}/{mib(entry.compress_size):.2f}MiB '
                  f'{entry.filename}'
              )

          report = '\n'.join(lines)
          print(report)
          pathlib.Path('apk-size-report.txt').write_text(report + '\n')
          notice = report.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::notice title=APK content breakdown::{notice}')
          PY

      - name: Verify APK + integrity
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n1)
          APK_NAME=$(basename "$APK")
          APK_SIZE=$(stat -c %s "$APK")
          APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK path: $APK"
          ls -lh "$APK"
          echo "sha256: $APK_SHA256"

          AAPT=$(find "$ANDROID_HOME" -name aapt -type f | sort -V | tail -n1)
          if [ -z "$AAPT" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            AAPT=$(find "$ANDROID_SDK_ROOT" -name aapt -type f | sort -V | tail -n1)
          fi
          BADGING=""
          if [ -n "$AAPT" ]; then
            BADGING=$("$AAPT" dump badging "$APK" | grep -E "package:|launchable-activity:" | head -n3 | tr '\n' ' ')
            echo "package/version: $BADGING"
          fi

          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SIGNING="verified Android debug-key signature"

          NOTICE="$APK_NAME | $APK_SIZE bytes | sha256=$APK_SHA256 | $SIGNING | $BADGING"
          echo "::notice title=APK verification::$NOTICE"
          echo "BUILD_OK=true" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        if: ${{ env.BUILD_OK == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dns-guardian-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
