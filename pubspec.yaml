name: dns_guardian
description: DNS Guardian — offline-first Private DNS protection (Arabic-first).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.0.0
  provider: ^6.1.0
  crypto: ^3.0.3
  sqflite: ^2.3.2
  path: ^1.8.3
  intl: ^0.19.0
  # No Firebase, no analytics, no network SDK

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Desktop FFI exists only to run SQLite unit tests on the CI host. It is
  # injected by tests and is not imported by production Android code.
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  # Localization is hand-written (lib/l10n/app_localizations.dart) to keep the
  # build offline and reproducible without flutter gen-l10n.
